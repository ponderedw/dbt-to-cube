version: 2
models:
- name: metricflow_time_spine
  description: "Date spine required by MetricFlow for time grain calculations"
  columns:
    - name: date_day
      description: "One row per calendar day from 2000-01-01 to 2030-12-31"

- name: course_performance_summary
  columns:
    - name: course_id
      description: "Unique identifier for the course"
      meta:
        label: "Course ID"
    - name: course_code
      description: "Course code (e.g., CS101, MATH201)"
      meta:
        label: "Course Code"
    - name: course_name
      description: "Full name of the course"
      meta:
        label: "Course Name"
    - name: credits
      description: "Number of credit hours for the course"
      meta:
        label: "Credit Hours"
    - name: difficulty_level
      description: "Course difficulty level (1-5 scale)"
      meta:
        label: "Difficulty Level"
    - name: department_name
      description: "Academic department offering the course"
      meta:
        label: "Department"
    - name: semester_name
      description: "Semester when the course was offered"
      meta:
        label: "Semester"
    - name: academic_year
      description: "Academic year of the course offering"
      meta:
        label: "Academic Year"
    - name: semester_start_date
      description: "Start date of the semester"
      meta:
        label: "Semester Start"
    - name: semester_end_date
      description: "End date of the semester"
      meta:
        label: "Semester End"
    - name: instructor_name
      description: "Name of the course instructor"
      meta:
        label: "Instructor"
    - name: instructor_position
      description: "Academic position of the instructor"
      meta:
        label: "Instructor Position"
    - name: performance_category
      description: "Overall performance category for the course"
      meta:
        label: "Performance Category"
  config:
    meta:
      metrics:
        average_course_gpa:
          type: average
          label: "Average Course GPA"
          description: "Mean grade point average across all enrolled students"
          format: "0.00"
          sql: avg_grade_points
        course_pass_rate:
          type: average
          label: "Course Pass Rate"
          description: "Proportion of students achieving a passing grade (2.0+ GPA)"
          format: "0.0%"
          sql: pass_rate_percentage / 100
        total_course_enrollments:
          type: sum
          label: "Total Course Enrollments"
          description: "Total number of student enrollments across all course sections"
          sql: total_enrollments
        student_engagement_score:
          type: average
          label: "Student Engagement Score"
          description: "Composite score combining attendance (60%) and academic performance (40%)"
          format: "0.0"
          sql: (avg_attendance * 0.6 + avg_grade_points * 25)
      pre_aggregations:
        # Real-time rollup with SQL refresh key
        course_performance_realtime:
          type: rollup
          measures:
            - average_course_gpa
            - total_course_enrollments
          dimensions:
            - department_name
            - semester_name
          time_dimension: semester_start_date
          granularity: month
          refresh_key:
            sql: "SELECT MAX(semester_end_date) FROM ${this}"
            every: "1 minute"
        
        # Daily refresh rollup
        course_performance_daily:
          type: rollup
          measures:
            - course_pass_rate
            - student_engagement_score
          dimensions:
            - department_name
          refresh_key:
            every: "1 day"
        
        # Simple rollup with custom interval
        course_performance_hourly:
          type: rollup
          measures:
            - total_course_enrollments
          dimensions:
            - performance_category
          refresh_key:
            every: "30 minutes"
      owner:
        - academic-analytics@university.edu

- name: student_attendance
  description: "Student attendance records aggregated by student, section, and semester"
  columns:
    - name: student_id
      description: "Unique student identifier"
      meta:
        label: "Student ID"
    - name: section_id
      description: "Physical course section column (logical name: course_id)"
      meta:
        label: "Course (Section ID)"
    - name: school_id
      description: "Unique school identifier"
      meta:
        label: "School ID"
    - name: academic_year
      description: "Academic year (e.g. 2024-2025)"
      meta:
        label: "Academic Year"
    - name: semester_name
      description: "Semester name (e.g. Fall 2024)"
      meta:
        label: "Semester"
    - name: semester_type
      description: "Season of the semester: Fall, Spring, or Summer"
      meta:
        label: "Semester Type"
    - name: school_name
      description: "Full name of the school"
      meta:
        label: "School"
    - name: gradespan
      description: "Grade span of the school (e.g. K-8, 9-12)"
      meta:
        label: "Gradespan"
    - name: is_odp_student
      description: "1 if the student is in an out-of-district placement (ODP)"
      meta:
        label: "ODP Student"
  config:
    meta:
      metrics:
        # Feature 1: basic sum metric
        total_days_enrolled:
          type: sum
          label: "Total Days Enrolled"
          description: "Total enrolled school days across all students"
          sql: days_enrolled

        # Feature 2: metric with format (attendance_rate is a 0-1 ratio → show as %)
        attendance_rate:
          type: average
          label: "Attendance Rate"
          description: "Average daily attendance rate (days present / days enrolled)"
          format: "0.0%"
          sql: attendance_rate

        # Feature 3: metric with filter — exclude ODP students (mirrors tardy_days example)
        tardy_days:
          type: sum
          label: "Tardy Days"
          description: >
            Total tardy days for non-ODP students. All reporting should exclude
            ODP students.
          sql: days_tardy
          filter: "is_odp_student = 0"

        # Feature 4: absence rate with format + filter combined
        absence_rate_non_odp:
          type: average
          label: "Absence Rate (non-ODP)"
          description: >
            Average absence rate for non-ODP students, as a percentage.
          format: "0.0%"
          sql: absence_rate
          filter: "is_odp_student = 0"

        # Feature 5: derived metric referencing other metrics via ${...}
        chronic_absence_days:
          type: sum
          label: "Chronic Absence Days"
          description: "Total absent days (complement of attendance)"
          sql: days_absent

      pre_aggregations:
        attendance_by_school_semester:
          type: rollup
          measures:
            - total_days_enrolled
            - attendance_rate
            - tardy_days
            - absence_rate_non_odp
            - chronic_absence_days
          dimensions:
            - school_name
            - gradespan
            - semester_name
            - academic_year
            - is_odp_student
          refresh_key:
            every: "1 day"