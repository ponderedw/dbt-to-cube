version: 2
models:
- name: course_performance_summary
  columns:
    - name: course_id
      description: "Unique identifier for the course"
    - name: course_code
      description: "Course code (e.g., CS101, MATH201)"
    - name: course_name
      description: "Full name of the course"
    - name: credits
      description: "Number of credit hours for the course"
    - name: difficulty_level
      description: "Course difficulty level (1-5 scale)"
    - name: department_name
      description: "Academic department offering the course"
    - name: semester_name
      description: "Semester when the course was offered"
    - name: academic_year
      description: "Academic year of the course offering"
    - name: semester_start_date
      description: "Start date of the semester"
    - name: semester_end_date
      description: "End date of the semester"
    - name: total_enrollments
      description: "Total number of students enrolled in the course"
    - name: avg_grade_points
      description: "Average grade points achieved by students"
    - name: avg_attendance
      description: "Average attendance percentage for the course"
    - name: excellent_performance
      description: "Number of students with excellent performance (3.5+ GPA)"
    - name: passing_grades
      description: "Number of students with passing grades (2.0+ GPA)"
    - name: instructor_name
      description: "Name of the course instructor"
    - name: instructor_position
      description: "Academic position of the instructor"
    - name: pass_rate_percentage
      description: "Percentage of students who passed the course"
    - name: excellence_rate_percentage
      description: "Percentage of students with excellent performance"
    - name: performance_category
      description: "Overall performance category for the course"
  config:
    meta:
      metrics:
        average_course_gpa:
          type: average
          label: "Average Course GPA"
          format: "0.00"
          sql: ${avg_grade_points}
        course_pass_rate:
          type: average
          label: "Course Pass Rate"
          format: "0.0%"
          sql: ${pass_rate_percentage} / 100
        total_course_enrollments:
          type: sum
          label: "Total Course Enrollments"
          sql: ${total_enrollments}
        student_engagement_score:
          type: average
          label: "Student Engagement Score"
          format: "0.0"
          sql: (${avg_attendance} * 0.6 + ${avg_grade_points} * 25)
      pre_aggregations:
        # Real-time rollup with SQL refresh key
        course_performance_realtime:
          type: rollup
          measures:
            - average_course_gpa
            - total_course_enrollments
          dimensions:
            - department_name
            - semester_name
          time_dimension: semester_start_date
          granularity: month
          refresh_key:
            sql: "SELECT MAX(semester_end_date) FROM ${this}"
        
        # Daily refresh rollup
        course_performance_daily:
          type: rollup
          measures:
            - course_pass_rate
            - student_engagement_score
          dimensions:
            - department_name
          refresh_key:
            every: "1 day"
        
        # Simple rollup with custom interval
        course_performance_hourly:
          type: rollup
          measures:
            - total_course_enrollments
          dimensions:
            - performance_category
          refresh_key:
            every: "30 minutes"
      owner:
        - academic-analytics@university.edu