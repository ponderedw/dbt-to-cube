version: 2

semantic_models:

  - name: semantic_course_performance
    model: ref('course_performance_summary')
    entities:
      - name: course_id
        type: primary
        expr: course_id
        label: "Course ID"
      # unique entity with same name as semantic_semester_enrollment's primary → one_to_one join
      - name: semester_id
        type: unique
        expr: semester_id
        label: "Semester ID"
    config:
      meta:
        pre_aggregations:
          course_by_department_monthly:
            type: rollup
            measures:
              - course_enrollment_count      # base measure
              - total_course_enrollments     # simple metric
              - cumulative_enrollments       # cumulative metric
            dimensions:
              - department_name
              - performance_category
            time_dimension: semester_start_date
            granularity: month
            refresh_key:
              every: "1 day"
    dimensions:
      - name: course_code
        type: categorical
        label: "Course Code"
        description: "Short code identifying the course (e.g. CS101, MATH201)."

      - name: course_name
        type: categorical
        label: "Course Name"
        description: "Full name of the course."

      - name: department_name
        type: categorical
        label: "Department"
        description: "Academic department offering the course."

      - name: semester_name
        type: categorical
        label: "Semester"
        description: "Semester in which the course was offered."

      - name: academic_year
        type: categorical
        label: "Academic Year"
        description: "Academic year of the course offering (e.g. 2023-2024)."

      - name: instructor_name
        type: categorical
        label: "Instructor"
        description: "Full name of the course instructor."

      - name: performance_category
        type: categorical
        label: "Performance Category"
        description: "Overall performance tier for the course (e.g. High, Medium, Low)."

      - name: semester_start_date
        type: time
        label: "Semester Start Date"
        description: "Date the semester began; used as the aggregation time dimension."
        type_params:
          time_granularity: day

    measures:
      - name: course_enrollment_count
        label: "Course Enrollment Count"
        description: "Total student enrolments across all course offerings."
        agg: sum
        expr: total_enrollments
        agg_time_dimension: semester_start_date

      - name: avg_course_gpa
        label: "Avg Course GPA"
        description: "Average grade point average across course offerings."
        agg: average
        expr: avg_grade_points
        agg_time_dimension: semester_start_date

      - name: avg_pass_rate
        label: "Avg Pass Rate"
        description: "Average pass-rate percentage across course offerings."
        agg: average
        expr: pass_rate_percentage
        agg_time_dimension: semester_start_date

      - name: avg_engagement_score
        label: "Avg Engagement Score"
        description: "Average composite engagement score (60% attendance + 40% GPA component)."
        agg: average
        expr: "(avg_attendance * 0.6 + avg_grade_points * 25)"
        agg_time_dimension: semester_start_date

  - name: semantic_semester_enrollment
    model: ref('semester_enrollment_trends')
    entities:
      - name: semester_id
        type: primary
        expr: semester_id
        label: "Semester ID"
      # foreign entity shared with semantic_student_attendance → many_to_many join
      - name: school_id
        type: foreign
        expr: school_id
        label: "School ID"
    config:
      meta:
        pre_aggregations:
          enrollment_by_semester_type_quarterly:
            type: rollup
            measures:
              - total_semester_enrollments   # base measure
              - total_semester_headcount     # simple metric
              - total_deans_list             # simple metric
            dimensions:
              - semester_type
              - academic_year
            time_dimension: start_date
            granularity: quarter
            refresh_key:
              every: "12 hours"
    dimensions:
      - name: semester_name
        type: categorical
        label: "Semester Name"
        description: "Human-readable name of the semester (e.g. Fall 2023)."

      - name: academic_year
        type: categorical
        label: "Academic Year"
        description: "Academic year the semester belongs to (e.g. 2023-2024)."

      - name: semester_type
        type: categorical
        label: "Semester Type"
        description: "Season of the semester: Fall, Spring, or Summer."

      - name: semester_status
        type: categorical
        label: "Semester Status"
        description: "Current status of the semester (e.g. Active, Completed)."

      - name: start_date
        type: time
        label: "Semester Start Date"
        description: "Date the semester began; used as the aggregation time dimension."
        type_params:
          time_granularity: day

      - name: end_date
        type: time
        label: "Semester End Date"
        description: "Date the semester ended."
        type_params:
          time_granularity: day

    measures:
      - name: total_semester_enrollments
        label: "Total Semester Enrollments"
        description: "Total number of student enrolments recorded in the semester."
        agg: sum
        expr: total_enrollments
        agg_time_dimension: start_date

      - name: total_unique_students
        label: "Total Unique Students"
        description: "Count of distinct students enrolled in the semester."
        agg: sum
        expr: unique_students
        agg_time_dimension: start_date

      - name: total_unique_courses
        label: "Total Unique Courses"
        description: "Count of distinct courses offered in the semester."
        agg: sum
        expr: unique_courses
        agg_time_dimension: start_date

      - name: avg_semester_gpa
        label: "Avg Semester GPA"
        description: "Average grade point average across all students in the semester."
        agg: average
        expr: avg_semester_grade_points
        agg_time_dimension: start_date

      - name: total_deans_list_students
        label: "Total Dean's List Students"
        description: "Number of students who achieved Dean's List standing."
        agg: sum
        expr: deans_list_students
        agg_time_dimension: start_date

      - name: total_probation_students
        label: "Total Probation Students"
        description: "Number of students placed on academic probation."
        agg: sum
        expr: probation_students
        agg_time_dimension: start_date

  # ── Attendance semantic model ──────────────────────────────────────────
  # Demonstrates: filters on measures, format, and foreign-key joins
  - name: semantic_student_attendance
    model: ref('student_attendance')
    description: "Student attendance data aggregated by student, section, and semester."
    config:
      meta:
        pre_aggregations:
          attendance_by_school_semester:
            type: rollup
            measures:
              - total_days_enrolled
              - avg_attendance_rate
              - tardy_days
              - absent_days
            dimensions:
              - school_name
              - gradespan
              - semester_name
              - academic_year
              - is_odp_student
            refresh_key:
              every: "1 day"

    entities:
      - name: student_id
        type: primary
        description: "Unique student identifier"
        label: "Student ID"

      # Foreign keys that generate Cube.js joins
      # course_id matches semantic_course_performance's primary entity → generates join
      - name: course_id
        type: foreign
        expr: section_id
        description: "Links each attendance record to its course (joins to SemanticCoursePerformance)"
        label: "Course ID"

      - name: school_id
        type: foreign
        description: "Links each attendance record to its school"
        label: "School ID"

    dimensions:
      - name: academic_year
        type: categorical
        label: "Academic Year"
        description: "Academic year (e.g. 2024-2025)."

      - name: semester_name
        type: categorical
        label: "Semester"
        description: "Semester name (e.g. Fall 2024)."

      - name: semester_type
        type: categorical
        label: "Semester Type"
        description: "Season: Fall, Spring, or Summer."

      - name: school_name
        type: categorical
        label: "School"
        description: "Full name of the school."

      - name: gradespan
        type: categorical
        label: "Gradespan"
        description: "Grade span of the school (e.g. K-8, 9-12)."

      - name: is_odp_student
        type: categorical
        label: "ODP Student"
        description: "1 if the student is in an out-of-district placement."

      - name: semester_status
        type: categorical
        label: "Semester Status"
        description: "Current status: Active, Completed, or Upcoming."

      - name: semester_start_date
        type: time
        label: "Semester Start Date"
        description: "Date the semester began; aggregation time dimension."
        type_params:
          time_granularity: day

    measures:
      # Feature: measure-level filter via CASE WHEN — the standard MetricFlow pattern.
      # This mirrors the PSDW production approach (e.g. cw_assignments_count uses
      # "case when bucket = 'CW' then assignment_count else null end").
      # Cube.js filters: [] are generated at the metric level (see metrics: section).
      - name: tardy_days
        label: "Tardy Days (non-ODP)"
        description: >
          Total tardy days for non-ODP students. All reporting should exclude
          out-of-district placement (ODP) students.
        agg: sum
        expr: "case when is_odp_student = 0 then days_tardy else null end"
        agg_time_dimension: semester_start_date

      # format belongs on the top-level metric (school_attendance_rate below), not the measure
      - name: avg_attendance_rate
        label: "Avg Attendance Rate"
        description: "Average daily attendance rate (days present / days enrolled), 0–1 scale."
        agg: average
        expr: attendance_rate
        agg_time_dimension: semester_start_date

      - name: total_days_enrolled
        label: "Total Days Enrolled"
        description: "Total enrolled school days across all students."
        agg: sum
        expr: days_enrolled
        agg_time_dimension: semester_start_date

      - name: absent_days
        label: "Absent Days"
        description: "Total absent days across all students."
        agg: sum
        expr: days_absent
        agg_time_dimension: semester_start_date


metrics:

  - name: total_course_enrollments
    label: "Total Course Enrollments"
    description: "Total number of student enrolments across all course offerings."
    type: simple
    type_params:
      measure: course_enrollment_count

  - name: average_course_gpa
    label: "Average Course GPA"
    description: "Mean grade point average across all course offerings."
    type: simple
    type_params:
      measure: avg_course_gpa

  - name: average_pass_rate
    label: "Average Pass Rate"
    description: "Mean pass-rate percentage across all course offerings."
    type: simple
    type_params:
      measure: avg_pass_rate
    meta:
      format: "percent"

  - name: average_engagement_score
    label: "Average Engagement Score"
    description: "Mean composite engagement score across course offerings."
    type: simple
    type_params:
      measure: avg_engagement_score

  - name: cumulative_enrollments
    label: "Cumulative Enrollments"
    description: "Running total of course enrolments over time."
    type: cumulative
    type_params:
      measure: course_enrollment_count

  - name: gpa_pass_quality_index
    label: "GPA–Pass Quality Index"
    description: "Composite quality score: GPA normalised to 0-100 multiplied by pass rate, divided by 100."
    type: derived
    type_params:
      expr: average_course_gpa * average_pass_rate / 100
      metrics:
        - name: average_course_gpa
        - name: average_pass_rate

  - name: total_semester_headcount
    label: "Total Semester Headcount"
    description: "Total distinct students enrolled across all semesters."
    type: simple
    type_params:
      measure: total_unique_students

  - name: total_semester_courses
    label: "Total Semester Courses"
    description: "Total distinct courses offered across all semesters."
    type: simple
    type_params:
      measure: total_unique_courses

  - name: average_semester_gpa
    label: "Average Semester GPA"
    description: "Mean grade point average across all semesters."
    type: simple
    type_params:
      measure: avg_semester_gpa

  - name: total_deans_list
    label: "Total Dean's List"
    description: "Total students achieving Dean's List standing."
    type: simple
    type_params:
      measure: total_deans_list_students

  - name: total_on_probation
    label: "Total Students on Probation"
    description: "Total students placed on academic probation."
    type: simple
    type_params:
      measure: total_probation_students

  - name: deans_list_rate
    label: "Dean's List Rate"
    description: "Proportion of enrolled students achieving Dean's List standing."
    type: ratio
    type_params:
      numerator: total_deans_list
      denominator: total_semester_headcount
    meta:
      format: "percent"

  - name: academic_risk_ratio
    label: "Academic Risk Ratio"
    description: "Ratio of students on academic probation to total enrolled students."
    type: ratio
    type_params:
      numerator: total_on_probation
      denominator: total_semester_headcount
    meta:
      format: "percent"

  - name: courses_per_student
    label: "Courses per Student"
    description: "Average number of courses taken per enrolled student each semester."
    type: derived
    type_params:
      expr: total_semester_courses / total_semester_headcount
      metrics:
        - name: total_semester_courses
        - name: total_semester_headcount

  # Feature: metric-level filter using plain SQL (Cube.js ${CUBE}.col syntax).
  # dbt renders {{ }} as Jinja2, so use ${CUBE}.col or plain SQL here.
  # The converter passes this straight through to Cube.js filters: [{ sql: `...` }].
  - name: active_semester_headcount
    label: "Active Semester Headcount"
    description: "Distinct students enrolled in semesters that are currently Active."
    type: simple
    type_params:
      measure: total_unique_students
    meta:
      filter: "${CUBE}.semester_status = 'Active'"

  # Feature: advanced (derived) metric with format
  - name: gpa_improvement_target
    label: "GPA Improvement Target"
    description: "GPA gap between Dean's List threshold (3.5) and average semester GPA, as a percentage."
    type: derived
    type_params:
      expr: (3.5 - average_semester_gpa) / 3.5 * 100
      metrics:
        - name: average_semester_gpa
    meta:
      format: "percent"

  # ── Attendance metrics (from semantic_student_attendance) ─────────────

  - name: total_tardy_days
    label: "Total Tardy Days"
    description: "Sum of tardy days for non-ODP students."
    type: simple
    type_params:
      measure: tardy_days

  - name: school_attendance_rate
    label: "School Attendance Rate"
    description: "Average daily attendance rate across all students."
    type: simple
    type_params:
      measure: avg_attendance_rate
    meta:
      format: "percent"

  - name: total_absent_days
    label: "Total Absent Days"
    description: "Sum of absent days across all students."
    type: simple
    type_params:
      measure: absent_days

  - name: total_enrolled_days
    label: "Total Enrolled Days"
    description: "Total enrolled school days across all students."
    type: simple
    type_params:
      measure: total_days_enrolled

  # Feature: ratio metric with format — classic chronic absenteeism KPI
  - name: chronic_absence_rate
    label: "Chronic Absence Rate"
    description: >
      Ratio of absent days to enrolled days across all students — a key
      indicator for chronic absenteeism tracking.
    type: ratio
    type_params:
      numerator: total_absent_days
      denominator: total_enrolled_days
    meta:
      format: "percent"
