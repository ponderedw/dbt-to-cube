version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: education_dw
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
    ports:
      - "5432:5432"
    volumes:
      # - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d education_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/dbt
    working_dir: /dbt/DbtEducationalDataProject
    environment:
      DBT_PROFILES_DIR: /dbt/DbtEducationalDataProject
    command: >
      sh -c "
        dbt deps &&
        dbt seed &&
        dbt run &&
        dbt docs generate
      "

  dbt-docs:
    build:
      context: ./DbtEducationalDataProject
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      dbt:
        condition: service_completed_successfully
    volumes:
      - .:/dbt
    working_dir: /usr/app/dbt

  cubestore:
    image: cubejs/cubestore:latest
    restart: always
    ports:
      - 3030:3030

  cube_api:
    restart: always
    image: cubejs/cube:latest
    ports:
      - 4000:4000
      - 15432:15432
    env_file: .env
    volumes:
      - .:/cube/conf
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
      cubestore:
        condition: service_started

  dbt-cube-sync:
    build:
      context: ./dbt-cube-sync
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      # Mount source code for development (allows changes without rebuild)
      - ./dbt-cube-sync/dbt_cube_sync:/app/dbt_cube_sync
    working_dir: /workspace
    depends_on:
      dbt:
        condition: service_completed_successfully
      cube_api:
        condition: service_started
      superset:
        condition: service_started
    entrypoint: []
    command: 
      - "/bin/sh"
      - "-c"
      - |
        echo 'Waiting for services to be ready...'
        sleep 30
        echo 'Starting automated data pipeline...'
        
        echo '🚀 Step 1: Converting dbt models to Cube.js schemas...'
        dbt-cube-sync dbt-to-cube \
          --manifest /workspace/DbtEducationalDataProject/target/manifest.json \
          --catalog /workspace/DbtEducationalDataProject/target/catalog.json \
          --output /workspace/cube_output
        
        echo '🚀 Step 2: Syncing Cube.js schemas to Superset...'
        dbt-cube-sync cube-to-bi superset \
          --cube-files /workspace/cube_output \
          --url http://superset:8088 \
          --username admin \
          --password admin \
          --cube-connection-name Cube
          
        echo '🎉 Full pipeline completed successfully!'
        echo 'Keeping container alive for monitoring...'
        tail -f /dev/null

  superset:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.superset
    ports:
      - 8088:8088
    environment:
      - SUPERSET_SECRET_KEY=your_secret_key_change_this_in_production
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
    volumes:
      # - superset_data:/app/superset_home
      - ./superset_config.py:/app/superset_config.py
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully

  superset-setup:
    build:
      context: ./superset-setup
      dockerfile: Dockerfile
    depends_on:
      superset:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

volumes:
  postgres_data:
  superset_data: