version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: education_dw
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
    ports:
      - "5432:5432"
    volumes:
      # - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d education_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/dbt
    working_dir: /dbt/DbtEducationalDataProject
    environment:
      DBT_PROFILES_DIR: /dbt/DbtEducationalDataProject
    command: >
      sh -c "
        dbt deps &&
        dbt seed &&
        dbt run &&
        dbt docs generate
      "

  dbt-docs:
    build:
      context: ./DbtEducationalDataProject
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      dbt:
        condition: service_completed_successfully
    volumes:
      - .:/dbt
    working_dir: /usr/app/dbt

  cubestore:
    image: cubejs/cubestore:latest
    restart: always
    ports:
      - 3030:3030

  cube_api:
    restart: always
    image: cubejs/cube:latest
    ports:
      - 4000:4000
      - 15432:15432
    env_file: .env
    volumes:
      - .:/cube/conf
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
      cubestore:
        condition: service_started

  dbt-cube-sync:
    build:
      context: ./dbt-cube-sync
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      dbt:
        condition: service_completed_successfully
      cube_api:
        condition: service_started
      superset:
        condition: service_started
    entrypoint: []
    command: 
      - "/bin/sh"
      - "-c"
      - |
        echo 'Waiting for services to be ready...'
        sleep 30
        echo 'Starting automated data pipeline...'
        
        echo '🚀 Step 1: Converting dbt models to Cube.js schemas...'
        dbt-cube-sync dbt-to-cube \
          --manifest /workspace/DbtEducationalDataProject/target/manifest.json \
          --catalog /workspace/DbtEducationalDataProject/target/catalog.json \
          --output /workspace/cube_output
        
        echo '🚀 Step 2: Syncing Cube.js schemas to Superset...'
        dbt-cube-sync cube-to-bi superset \
          --cube-files /workspace/cube_output \
          --url http://superset:8088 \
          --username admin \
          --password admin \
          --cube-connection-name Cube
          
        echo '🎉 Full pipeline completed successfully!'
        echo 'Keeping container alive for monitoring...'
        tail -f /dev/null

  superset:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.superset
    ports:
      - 8088:8088
    environment:
      - SUPERSET_SECRET_KEY=your_secret_key_change_this_in_production
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
    volumes:
      # - superset_data:/app/superset_home
      - ./superset_config.py:/app/superset_config.py
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully

  superset-setup:
    build:
      context: ./superset-setup
      dockerfile: Dockerfile
    depends_on:
      superset:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  metabase:
    image: metabase/metabase:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: dbt_user
      MB_DB_PASS: dbt_password
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  metabase-setup:
    image: curlimages/curl:latest
    depends_on:
      metabase:
        condition: service_healthy
      cube_api:
        condition: service_started
    restart: "no"
    command: >
      sh -c '
        echo "Waiting for Metabase to be fully ready...";
        sleep 30;

        echo "Setting up Metabase admin user...";
        SETUP_TOKEN=$$(curl -s http://metabase:3000/api/session/properties | grep -o "\"setup-token\":\"[^\"]*\"" | cut -d"\"" -f4);

        if [ -n "$$SETUP_TOKEN" ]; then
          echo "Setup token found: $$SETUP_TOKEN";

          curl -X POST http://metabase:3000/api/setup \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$$SETUP_TOKEN\",
              \"user\": {
                \"first_name\": \"Admin\",
                \"last_name\": \"User\",
                \"email\": \"admin@example.com\",
                \"password\": \"CubeAdmin2024!\",
                \"site_name\": \"Cube Analytics\"
              },
              \"prefs\": {
                \"site_name\": \"Cube Analytics\",
                \"allow_tracking\": false
              }
            }";

          echo "Getting session token...";
          SESSION_TOKEN=$$(curl -X POST http://metabase:3000/api/session \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"admin@example.com\", \"password\": \"CubeAdmin2024!\"}" | grep -o "\"id\":\"[^\"]*\"" | cut -d"\"" -f4);

          if [ -n "$$SESSION_TOKEN" ]; then
            echo "Session token obtained: $$SESSION_TOKEN";

            echo "Adding Cube.js database connection...";
            curl -X POST http://metabase:3000/api/database \
              -H "Content-Type: application/json" \
              -H "X-Metabase-Session: $$SESSION_TOKEN" \
              -d "{
                \"name\": \"Cube.js\",
                \"engine\": \"postgres\",
                \"details\": {
                  \"host\": \"cube_api\",
                  \"port\": 15432,
                  \"dbname\": \"db\",
                  \"user\": \"root\",
                  \"password\": \"\",
                  \"ssl\": false,
                  \"tunnel-enabled\": false
                },
                \"auto_run_queries\": true,
                \"is_full_sync\": true,
                \"schedules\": {}
              }";

            echo "Metabase setup completed successfully!";
          else
            echo "Failed to get session token";
          fi
        else
          echo "Metabase already configured or setup token not available";
        fi;

        echo "Setup complete. Check Metabase at http://localhost:3000";
      '

volumes:
  postgres_data:
  superset_data: